version: '3.9'

services:
  db:
    image: mariadb:10.11
    container_name: otrs-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${OTRS_DB_NAME:-otrs}
      MYSQL_USER: ${OTRS_DB_USER:-otrs}
      MYSQL_PASSWORD: ${OTRS_DB_PASSWORD:?OTRS_DB_PASSWORD is required}
    volumes:
      - db_data:/var/lib/mysql
      - ./config/mysql.cnf:/etc/mysql/conf.d/otrs.cnf:ro
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  znuny:
    image: znuny/znuny:latest
    container_name: otrs-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8080}:80"
    environment:
      ZNUNY_DB_HOST: db
      ZNUNY_DB_PORT: "3306"
      ZNUNY_DB_NAME: ${OTRS_DB_NAME:-otrs}
      ZNUNY_DB_USER: ${OTRS_DB_USER:-otrs}
      ZNUNY_DB_PASSWORD: ${OTRS_DB_PASSWORD:?OTRS_DB_PASSWORD is required}
      ZNUNY_ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ZNUNY_SYSTEM_EMAIL: ${SYSTEM_EMAIL}
      ZNUNY_ORGANIZATION: ${ORGANIZATION:-My Company}
    volumes:
      - znuny_data:/opt/otrs/var
      - znuny_config:/opt/otrs/Kernel

volumes:
  db_data:
  znuny_data:
  znuny_config:
